name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt

      # No Tk and no virtual display any more. The page tests drive the app
      # through NiceGUI's user simulation, which needs neither a browser nor a
      # display, so a plain runner is enough.
      - name: Run tests
        run: python -m pytest -q

  compile:
    name: Byte-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Catches syntax errors in every module, including ones no test imports.
      - name: Compile all sources
        run: python -m compileall -q app.py clients utilities web tests
